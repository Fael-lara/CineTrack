<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>CineTrack</title>
        <link rel="stylesheet" href="style.css">
    </head>
<body>
    <header>
        <h1>CineTrack</h1>
        <input type="search" aria-label="Buscar filme" placeholder="Buscar filme...">
        <button class="adicionar">
            <span class="texto-mobile">+</span>
            <span class="texto-desktop">+ Adicionar</span>
        </button>
    </header>
    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos">Todos</button>
        <button type="button" data-status="assistido">Assistido</button>
        <button type="button" data-status="assistindo">Assistindo</button>
        <button type="button" data-status="quero">Quero assistir</button>
    </nav>
    <main>
        <section id="lista" aria-live="polite">
        </section>
    </main>
    <footer>
        <small>CineTrack - UEM</small> <br>
        <a href="adicionar.html">Adicionar Filme</a>
    </footer>
    <div id="modal" hidden>
        <div class="modal-conteudo">
            <h2>Adicionar filme</h2>
            <form id="form-filme">
                <label for="titulo">Titulo</label> <br>
                <input id="titulo" type="text" name="titulo" required> <br>
                
                <label for="ano">Ano</label> <br>
                <input id="ano" type="number"
                min="1888" max="2030" name="ano" required> <br>

                <label for="genero">Gênero</label> <br>
                <input id="genero" type="text" name="genero" required> <br>

                <label for="url">Url do pôster</label> <br>
                <input id="url" type="url" name="url"> <br>

                <label for="status">Status</label> <br>
                <select id="status" name="status" required>
                        <option value="QueroAssistir">Quero Assistir</option>
                        <option value="Assistido">Assistido</option>
                        <option value="Assistindo">Assistindo</option>
                </select> <br>

                <label for="nota">Nota (1 a 5)</label> <br>
                <input id="nota" type="number" min="1" max="5" name="nota"> <br>

                <label for="comentario">Comentário</label> <br>
                <textarea id="comentario" name="comentario"></textarea> <br>

                <button type="button" class="btn-cancelar">Cancelar</button>
                <button type="submit" class="btn-salvar">salvar</button>
            </form>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
